name: Build Android APK (app movil)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppMovilPollos/apppllr-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable

      - name: Restore debug keystore
        run: |
          mkdir -p .android-signing
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 --decode > .android-signing/debug.keystore

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AppMovilPollos/apppllr-main/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-${{ github.run_number }}
          name: APK debug #${{ github.run_number }}
          prerelease: true
          files: AppMovilPollos/apppllr-main/build/app/outputs/flutter-apk/app-debug.apk
